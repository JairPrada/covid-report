<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  #map { height: 100vh; width: 100%; background: #0b1020; }
  /* Mapa oscuro sin API key: invertimos los tiles de OpenStreetMap */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }
  .panel-covid {
    position: fixed; top: 64px; left: 12px; z-index: 1000; width: 300px;
    background: rgba(17, 24, 39, 0.82); backdrop-filter: blur(8px);
    color: #e5e7eb; border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .panel-covid h5 { margin: 0 0 8px; font-weight: 700; letter-spacing: 0.3px; }
  .stat { display: flex; justify-content: space-between; font-size: 13px; margin: 3px 0; }
  .stat b { font-variant-numeric: tabular-nums; }
  .legend { margin-top: 10px; font-size: 11px; line-height: 1.7; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #111827; color: #e5e7eb; }
  .leaflet-popup-content { margin: 10px 12px; }
  .badge2 { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; margin: 2px 0; }
</style>

<div class="panel-covid">
  <h5>COVID-19 en el mundo</h5>
  <div id="totales" class="text-muted" style="font-size: 12px;">Cargando datos…</div>
  <div class="legend">
    <div><span class="dot" style="background:#4caf50"></span> &lt; 100 mil casos</div>
    <div><span class="dot" style="background:#ffeb3b"></span> &lt; 500 mil</div>
    <div><span class="dot" style="background:#ff9800"></span> &lt; 2 millones</div>
    <div><span class="dot" style="background:#f44336"></span> &lt; 10 millones</div>
    <div><span class="dot" style="background:#9c27b0"></span> &gt; 10 millones</div>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  const map = L.map('map', { worldCopyJump: true, scrollWheelZoom: true }).setView([20, -30], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  function colorPorCasos(c) {
    if (c >= 10000000) return '#9c27b0';
    if (c >= 1000000) return '#f44336';
    if (c >= 200000) return '#ff9800';
    if (c >= 100000) return '#ffeb3b';
    return '#4caf50';
  }
  function radioPorCasos(c) {
    return Math.min(14, Math.max(5, (Math.log10(c + 1) - 3) * 2.6));
  }

  async function cargar() {
    try {
      const res = await fetch('https://disease.sh/v3/covid-19/countries?sort=cases');
      const datos = await res.json();
      let tc = 0, td = 0, tr = 0, n = 0;
      datos.forEach(function (d) {
        const lat = d.countryInfo.lat;
        const lng = d.countryInfo.long;
        if (!lat && !lng) return;
        tc += d.cases; td += d.deaths; tr += d.recovered; n++;
        const marker = L.circleMarker([lat, lng], {
          radius: radioPorCasos(d.cases),
          fillColor: colorPorCasos(d.cases),
          color: '#0b1020',
          weight: 1,
          fillOpacity: 0.8
        }).addTo(map);
        marker.bindPopup(
          '<div style="min-width:210px">' +
          '<h6 class="mb-1">' + d.country + '</h6>' +
          '<span class="badge2" style="background:#f44336;color:#fff">Confirmados: ' + d.cases.toLocaleString('es') + '</span><br>' +
          '<span class="badge2" style="background:#6b7280;color:#fff">Muertos: ' + d.deaths.toLocaleString('es') + '</span><br>' +
          '<span class="badge2" style="background:#4caf50;color:#062">Recuperados: ' + d.recovered.toLocaleString('es') + '</span><br>' +
          '<span class="badge2" style="background:#1e88e5;color:#fff">Hoy: +' + d.todayCases.toLocaleString('es') + '</span>' +
          '</div>'
        );
      });
      document.getElementById('totales').innerHTML =
        '<div class="stat"><span>Países</span><b>' + n + '</b></div>' +
        '<div class="stat"><span>Confirmados</span><b style="color:#f87171">' + tc.toLocaleString('es') + '</b></div>' +
        '<div class="stat"><span>Muertos</span><b style="color:#9ca3af">' + td.toLocaleString('es') + '</b></div>' +
        '<div class="stat"><span>Recuperados</span><b style="color:#34d399">' + tr.toLocaleString('es') + '</b></div>';
    } catch (e) {
      document.getElementById('totales').textContent = 'No se pudieron cargar los datos.';
    }
  }
  cargar();
</script>
