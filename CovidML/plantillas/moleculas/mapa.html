<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  html, body { margin: 0; padding: 0; background: #060912; }
  #globe { position: fixed; top: 0; left: 0; height: 100vh; width: 100%; }
  .panel-covid {
    position: fixed; top: 64px; left: 14px; z-index: 1000; width: 300px;
    background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(10px);
    color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 16px; padding: 16px 18px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .panel-covid h5 { margin: 0 0 10px; font-weight: 700; letter-spacing: 0.3px; color: #f8fafc; }
  .stat { display: flex; justify-content: space-between; font-size: 13px; margin: 4px 0; color: #cbd5e1; }
  .stat b { font-variant-numeric: tabular-nums; color: #f1f5f9; }
  .legend { margin-top: 12px; font-size: 11px; line-height: 1.8; color: #94a3b8; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: middle; box-shadow: 0 0 8px currentColor; }
  .hint { margin-top: 10px; font-size: 10.5px; color: #64748b; }
</style>

<div class="panel-covid">
  <h5>COVID-19 en el mundo</h5>
  <div id="totales" style="font-size: 12px; color: #94a3b8;">Cargando datos…</div>
  <div class="legend">
    <div><span class="dot" style="color:#38bdf8;background:#38bdf8"></span> &lt; 100 mil casos</div>
    <div><span class="dot" style="color:#818cf8;background:#818cf8"></span> &lt; 500 mil</div>
    <div><span class="dot" style="color:#c084fc;background:#c084fc"></span> &lt; 2 millones</div>
    <div><span class="dot" style="color:#f472b6;background:#f472b6"></span> &lt; 10 millones</div>
    <div><span class="dot" style="color:#fb7185;background:#fb7185"></span> &gt; 10 millones</div>
  </div>
  <div class="hint">Arrastra para girar · rueda para zoom · clic en un punto</div>
</div>

<div id="globe"></div>

<script src="//unpkg.com/globe.gl"></script>
<script>
  function colorPorCasos(c) {
    if (c >= 10000000) return '#fb7185';
    if (c >= 1000000) return '#f472b6';
    if (c >= 200000) return '#c084fc';
    if (c >= 100000) return '#818cf8';
    return '#38bdf8';
  }
  function altura(c) { return Math.min(0.42, 0.05 + Math.log10(c + 1) / 28); }

  const world = Globe()(document.getElementById('globe'))
    .backgroundColor('#060912')
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
    .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
    .showAtmosphere(true)
    .atmosphereColor('#5b8cff')
    .atmosphereAltitude(0.18)
    .pointLat('lat').pointLng('lng')
    .pointColor('color').pointAltitude('alt').pointRadius(0.32)
    .pointLabel(function (d) {
      return '<div style="font-family:system-ui;background:#0f172a;color:#e2e8f0;' +
        'padding:8px 10px;border-radius:10px;border:1px solid rgba(148,163,184,.25);min-width:190px">' +
        '<strong>' + d.country + '</strong><br>' +
        '<span style="color:#f87171">Confirmados: ' + d.cases.toLocaleString('es') + '</span><br>' +
        '<span style="color:#94a3b8">Muertos: ' + d.deaths.toLocaleString('es') + '</span><br>' +
        '<span style="color:#34d399">Recuperados: ' + d.recovered.toLocaleString('es') + '</span><br>' +
        '<span style="color:#7dd3fc">Hoy: +' + d.todayCases.toLocaleString('es') + '</span>' +
        '</div>';
    });

  world.width(window.innerWidth).height(window.innerHeight);
  world.controls().autoRotate = true;
  world.controls().autoRotateSpeed = 0.55;
  world.controls().enableZoom = true;
  world.pointOfView({ lat: 12, lng: -20, altitude: 2.4 }, 0);
  window.addEventListener('resize', function () {
    world.width(window.innerWidth).height(window.innerHeight);
  });

  async function cargar() {
    try {
      const res = await fetch('https://disease.sh/v3/covid-19/countries?sort=cases');
      const datos = await res.json();
      const puntos = [];
      const anillos = [];
      let tc = 0, td = 0, tr = 0, n = 0;
      datos.forEach(function (d) {
        const lat = d.countryInfo.lat, lng = d.countryInfo.long;
        if (!lat && !lng) return;
        tc += d.cases; td += d.deaths; tr += d.recovered; n++;
        const p = {
          lat: lat, lng: lng, country: d.country,
          cases: d.cases, deaths: d.deaths, recovered: d.recovered, todayCases: d.todayCases,
          color: colorPorCasos(d.cases), alt: altura(d.cases)
        };
        puntos.push(p);
        if (n <= 15) {
          anillos.push({ lat: lat, lng: lng, color: colorPorCasos(d.cases) });
        }
      });
      world.pointsData(puntos).ringsData(anillos)
        .ringColor('color').ringMaxRadius(4).ringPropagationSpeed(2).ringRepeatPeriod(900);
      document.getElementById('totales').innerHTML =
        '<div class="stat"><span>Países</span><b>' + n + '</b></div>' +
        '<div class="stat"><span>Confirmados</span><b style="color:#f87171">' + tc.toLocaleString('es') + '</b></div>' +
        '<div class="stat"><span>Muertos</span><b style="color:#94a3b8">' + td.toLocaleString('es') + '</b></div>' +
        '<div class="stat"><span>Recuperados</span><b style="color:#34d399">' + tr.toLocaleString('es') + '</b></div>';
    } catch (e) {
      document.getElementById('totales').textContent = 'No se pudieron cargar los datos.';
    }
  }
  cargar();
</script>
