  function colorPorCasos(c) {
    if (c > 20000000) return "#7b1fa2";
    if (c > 10000000) return "#9c27b0";
    if (c > 5000000) return "#c2185b";
    if (c > 1000000) return "#e91e63";
    if (c > 500000) return "#ff5252";
    return "#ff8a80";
  }

  datos.forEach(function (d) {
    const radio = Math.max(6, Math.sqrt(d.confirmed) / 35);
    const marker = L.circleMarker([d.lat, d.lng], {
      radius: radio,
      fillColor: colorPorCasos(d.confirmed),
      color: "#ffffff",
      weight: 1,
      fillOpacity: 0.75
    }).addTo(map);

    const popup =
      '<div style="min-width:220px">' +
      '<h5 class="mb-2">' + d.country + '</h5>' +
      '<p class="mb-1"><span class="badge badge-danger">Muertos: ' + d.deaths.toLocaleString('es') + '</span></p>' +
      '<p class="mb-1"><span class="badge badge-success">Confirmados: ' + d.confirmed.toLocaleString('es') + '</span></p>' +
      '<p class="mb-1"><span class="badge badge-warning">Recuperados: ' + d.recovered.toLocaleString('es') + '</span></p>' +
      '<p class="text-muted" style="font-size:11px">Datos de ejemplo</p>' +
      '</div>';

    marker.bindPopup(popup);
